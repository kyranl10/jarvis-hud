<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Jarvis Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }

/* Same visual language as the Jarvis HUD: one dark theme by design, cyan telemetry on near-black. */
:root {
  --void: #04080d;
  --panel: rgba(20, 60, 80, 0.18);
  --panel-solid: #08131b;
  --line: rgba(111, 227, 255, 0.22);
  --arc: #6fe3ff;
  --arc-dim: #4a9bb3;
  --text: #d7f6ff;
  --muted: #7fa8b6;
  --gold: #ffbf4d;
  --alert: #ff6b5b;
  --ok: #5fe0a0;
  --paper: #fbfcfd;
  --ink: #15202b;
  --display: "Rajdhani", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html { background: var(--void); }
body {
  background: var(--void) radial-gradient(ellipse 120% 50% at 50% -10%, rgba(111, 227, 255, 0.10), transparent 60%);
  color: var(--text); font-family: var(--display); font-size: 17px;
  min-height: 100vh; padding-inline: 16px;
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; }
header { display: grid; gap: 4px; }
header .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.24em; color: var(--arc-dim); text-transform: uppercase; }
header h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: 0.03em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 15px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { border: 1px solid var(--line); background: var(--panel); padding: 10px 12px; display: grid; gap: 2px; }
.stat b { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
.stat i { font-style: normal; font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, 1fr); } }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.tab {
  font: 600 13px var(--display); letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted); background: none; border: 1px solid transparent; padding: 7px 12px; cursor: pointer;
}
.tab[aria-selected="true"] { color: var(--arc); border-color: var(--line); background: var(--panel); }
.tab .n { font-family: var(--mono); letter-spacing: 0; margin-left: 6px; color: var(--arc-dim); }

.list { display: grid; gap: 14px; }
.job {
  border: 1px solid var(--line); background: var(--panel); padding: 14px 16px 16px; display: grid; gap: 10px;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
}
.job .co { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--arc-dim); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.job h3 { margin: 0; font-size: 21px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: 84px 1fr; gap: 4px 12px; margin: 0; }
.facts dt { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.facts dd { margin: 0; min-width: 0; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.summary { margin: 0; color: var(--text); font-size: 16px; line-height: 1.4; max-width: 65ch; }
.reqs { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; list-style: none; }
.reqs li { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); padding: 2px 7px; }
.job .co-meta { display: inline-flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.job .posted { color: var(--arc); font-variant-numeric: tabular-nums; }
.fresh-tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; padding: 1px 7px; color: var(--void); background: var(--gold); font-variant-numeric: tabular-nums; }
.odds { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; padding: 1px 7px; border: 1px solid currentColor; font-variant-numeric: tabular-nums; }
.odds.hi { color: var(--ok); } .odds.mid { color: var(--gold); } .odds.lo { color: var(--alert); }
.sort { margin-left: auto; display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.sort select { font-size: 14px; padding: 4px 8px; }
.sort.src { margin-left: 0; }
.status { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; padding: 1px 7px; border: 1px solid currentColor; text-transform: uppercase; }
.st-tailoring, .st-review { color: var(--gold); }
.st-ready { color: var(--arc); }
.st-applied, .st-interview { color: var(--ok); }
.st-offer { color: var(--ok); }
.st-rejected, .st-denied { color: var(--alert); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button.btn, a.btn {
  font: 600 13px var(--display); letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none;
  color: var(--arc); background: transparent; border: 1px solid var(--line); padding: 9px 14px; cursor: pointer;
}
button.btn:hover, a.btn:hover, button.btn:focus-visible, a.btn:focus-visible { border-color: var(--arc); box-shadow: 0 0 14px rgba(111, 227, 255, 0.3); outline: none; }
button.btn.primary { background: rgba(111, 227, 255, 0.14); border-color: var(--arc); }
button.btn.deny { color: var(--alert); border-color: rgba(255, 107, 91, 0.35); }
button.btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
select { font: 500 15px var(--display); color: var(--text); background: var(--panel-solid); border: 1px solid var(--line); padding: 7px 10px; }
textarea { width: 100%; min-height: 70px; font: 15px var(--display); color: var(--text); background: var(--panel-solid); border: 1px solid var(--line); padding: 8px 10px; resize: vertical; }
.note { color: var(--muted); font-size: 14px; margin: 0; }
.note.warn { color: var(--gold); }
.empty { color: var(--muted); font-size: 16px; padding: 20px 0; text-align: center; }

/* Tailored resume preview: a sheet of paper so it reads like the PDF it becomes */
.back { font-family: var(--mono); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--arc); text-decoration: none;
  justify-self: start; border: 1px solid var(--line); padding: 8px 14px; margin-bottom: 6px; }
.back:hover { color: var(--arc); }
a.btn.primary { background: rgba(111, 227, 255, 0.14); border-color: var(--arc); }
.gist { margin: 0; font-size: 17px; line-height: 1.45; max-width: 65ch; }
.why { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.4; }
.why b { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; color: var(--arc-dim); margin-right: 4px; }
.lvl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; padding: 1px 7px; border: 1px solid currentColor; text-transform: uppercase; }
.lvl.act { color: var(--alert); } .lvl.fyi { color: var(--arc); }
.plan { border-left: 2px solid var(--arc); padding-left: 12px; display: grid; gap: 6px; }
.plan summary { cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--arc); }
.plan b { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--arc-dim); font-weight: 500; }
.plan p { margin: 0; font-size: 16px; line-height: 1.4; }
.plan ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 16px; line-height: 1.35; }
.who { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; padding: 0 5px; margin-right: 6px;
       border: 1px solid var(--line); color: var(--muted); vertical-align: 2px; }
.who.jarvis { color: var(--arc); border-color: var(--arc-dim); }
.result { border-left: 2px solid var(--ok); padding-left: 12px; margin: 0; font-size: 16px; line-height: 1.4; }
.result.blocked { border-color: var(--gold); }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; padding: 1px 7px; border: 1px solid currentColor; text-transform: uppercase; }
.tag.working, .tag.needs_you { color: var(--gold); } .tag.done { color: var(--ok); } .tag.denied, .tag.none { color: var(--muted); }
.clears { align-self: center; margin-left: 4px; font: 12px var(--mono); color: var(--muted); }
.mail { background: var(--panel-solid); border: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 8px; }
.mail pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 15px/1.45 var(--display); color: var(--text); max-height: 60vh; overflow-y: auto; }
textarea { box-sizing: border-box; width: 100%; min-height: 70px; font: 15px var(--display); color: var(--text); background: var(--panel-solid); border: 1px solid var(--line); padding: 8px 10px; resize: vertical; }
button.btn.primary, a.btn.primary { background: rgba(111, 227, 255, 0.14); border-color: var(--arc); }
button.btn.deny { color: var(--alert); border-color: rgba(255, 107, 91, 0.35); }
button.btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
.foot { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-50%); z-index: 20;
  width: max-content; max-width: calc(100% - 32px); margin: 0; padding: 10px 16px; text-align: center; font-family: var(--mono); font-size: 12px;
  letter-spacing: 0.08em; line-height: 1.4; color: var(--text); background: rgba(4, 8, 13, 0.96); border: 1px solid var(--arc); }
.foot:empty { display: none; }
.job.focus { border-color: var(--arc); }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <a class="back" href="./" id="back">‹ HUD</a>
    <span class="kicker">Jarvis · Mail</span>
    <h1>Emails worth your time</h1>
    <p id="scan">What each email says, with a plan whenever you ask. Nothing is ever sent without you.</p>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="needs" aria-selected="true">Needs you<span class="n" id="n-needs"></span></button>
    <button class="tab" role="tab" data-tab="fyi" aria-selected="false">FYI<span class="n" id="n-fyi"></span></button>
    <button class="tab" role="tab" data-tab="done" aria-selected="false">Handled<span class="n" id="n-done"></span></button>
    <button class="tab" role="tab" data-tab="dismissed" aria-selected="false">Dismissed<span class="n" id="n-dismissed"></span></button>
  </nav>
  <section class="list" id="list" aria-live="polite"><p class="empty">Loading your mail…</p></section>
  <p class="foot" id="foot"></p>
</main>
<script src="jarvis.js"></script>
<script>
// Your mail, as Jarvis's triage left it. On the private site: plans come from the site's quick AI in seconds,
// Dismiss and Restore save at once, and Approve or your own instructions wake Jarvis (Claude) to write drafts.
// The public GitHub copy only shows the flagged list from the HUD's feed.
const KEEP_DISMISSED = 3 * 24 * 3600e3;
const STATUS = { working: "Jarvis is on it", done: "Done", denied: "Dismissed", needs_you: "Needs your input" };
const $ = (id) => document.getElementById(id);
const esc = J.esc, safeUrl = J.safeUrl;
const when = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); };
let sayTimer;
const say = (t) => { $("foot").textContent = t || ""; clearTimeout(sayTimer); if (t) sayTimer = setTimeout(() => { $("foot").textContent = ""; }, 9000); };
let live = false, items = new Map(), tab = "needs";
const open = new Set(), keep = new Map(), busy = new Set();

function bucket(m) {
  const st = m.status || "open";
  if (st === "open") return m.plan || m.level === "act" ? "needs" : "fyi";
  if (st === "needs_you" || st === "working") return "needs";
  return st === "denied" ? "dismissed" : "done";
}
for (const b of document.querySelectorAll(".tab")) {
  b.onclick = () => { tab = b.dataset.tab; for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", String(t === b)); render(); };
}

function render() {
  const all = [...items.values()];
  for (const t of ["needs", "fyi", "done", "dismissed"]) $("n-" + t).textContent = all.filter((m) => bucket(m) === t).length || "";
  for (const ta of document.querySelectorAll("textarea[data-id]")) keep.set(ta.dataset.id, ta.value);
  const shown = all.filter((m) => bucket(m) === tab).sort((a, b) => tab === "done" || tab === "dismissed"
    ? (b.handled || b.decidedAt || 0) - (a.handled || a.decidedAt || 0)
    : (a.level === "act") === (b.level === "act") ? String(b.at).localeCompare(String(a.at)) : a.level === "act" ? -1 : 1);
  if (!shown.length) {
    $("list").innerHTML = `<p class="empty">${{ needs: "Nothing needs you right now, sir.", fyi: "No FYI emails.", done: "Nothing handled yet.", dismissed: "Nothing dismissed in the last 3 days." }[tab]}</p>`;
    return;
  }
  $("list").innerHTML = shown.map(card).join("");
  for (const ta of document.querySelectorAll("textarea[data-id]")) ta.value = keep.get(ta.dataset.id) || "";
  for (const el of document.querySelectorAll("[data-act]")) el.onclick = () => act(el.dataset.act, el.dataset.id);
}

function outlookUrl(d) {
  if (!d || !(d.subject || d.body)) return "";
  return "https://outlook.office.com/mail/deeplink/compose?" + [["to", d.to], ["cc", d.cc], ["subject", d.subject], ["body", d.body]]
    .filter(([, v]) => v).map(([k, v]) => k + "=" + encodeURIComponent(String(v))).join("&");
}

function card(m) {
  const st = m.status || "open", p = m.plan, gmail = safeUrl(m.url), id = esc(m.id);
  let h = `<div class="co"><span>${esc(m.from)}</span><span class="co-meta">${st === "open"
      ? `<span class="lvl ${m.level === "act" ? "act" : "fyi"}">${m.level === "act" ? "Act" : m.level === "fyi" ? "FYI" : "Mail"}</span>`
      : `<span class="tag ${esc(st)}">${esc(STATUS[st] || st)}</span>`}${m.at ? `<span class="posted">${esc(when(m.at))}</span>` : ""}</span></div>
    <h3>${esc(m.subject)}</h3>
    ${m.gist ? `<p class="gist">${esc(m.gist)}</p>` : ""}
    ${m.why ? `<p class="why">${m.gist ? "<b>Why it matters</b> " : ""}${esc(m.why)}</p>` : ""}`;
  if (p) h += `<details class="plan" ${m.plannedAt && Date.now() - m.plannedAt < 6 * 3600e3 ? "open" : ""}><summary>Jarvis's plan${p.deadline ? " · by " + esc(p.deadline) : ""}</summary>
      ${p.summary ? `<p>${esc(p.summary)}</p>` : ""}
      ${(p.steps || []).length ? `<ol>${p.steps.map((s) => `<li><span class="who ${s.who === "jarvis" ? "jarvis" : ""}">${s.who === "jarvis" ? "Jarvis" : "You"}</span>${esc(s.text)}</li>`).join("")}</ol>` : ""}</details>`;
  if (m.decision && st !== "open") h += `<p class="note">You ${m.decision === "approve" ? "approved the plan" : m.decision === "deny" ? "dismissed it" : "said"}${m.note ? `: “${esc(m.note)}”` : "."}</p>`;
  if (m.result) h += `<p class="result ${st === "needs_you" ? "blocked" : ""}">${esc(m.result)}</p>`;
  const links = (m.links || []).filter((l) => safeUrl(l.url)), outlook = outlookUrl(m.outlook);
  if (links.length || outlook) h += `<div class="links">${links.map((l) => `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label || "Open")}</a>`).join("")}${
    outlook ? `<a class="btn primary" href="${esc(outlook)}" target="_blank" rel="noopener" title="Opens a new email from your UNC account with this draft filled in">Open in Outlook</a>` : ""}</div>`;
  if (st === "working") h += `<p class="note warn">Jarvis is working on this. It shows up here when it's done, usually within a couple of minutes.</p>`;
  const canRead = live && m.body;
  h += `<div class="actions">${canRead ? `<button class="btn" data-act="read" data-id="${id}">${open.has(m.id) ? "Hide email" : "Read email"}</button>` : ""}${
    gmail ? `<a class="btn ${canRead ? "" : "primary"}" href="${esc(gmail)}" target="_blank" rel="noopener">Open in Gmail</a>` : ""}</div>`;
  if (open.has(m.id) && m.body) h += `<div class="mail"><pre>${esc(m.body)}</pre></div>`;
  if (!live) return `<article class="job" id="m-${id}">${h}</article>`;
  if (st === "open" || st === "needs_you") {
    const thinking = busy.has(m.id);
    h += `<label class="note" for="r-${id}">${p ? "Your input (optional for Approve)" : "Want Jarvis to do something with this? (optional for a plan)"}</label>
      <textarea id="r-${id}" data-id="${id}" placeholder="${p ? "e.g. make the email shorter, mention my VenueHorn work" : "e.g. draft a reply saying I'll be there"}"></textarea>
      <div class="actions">
        ${p ? `<button class="btn primary" data-act="approve" data-id="${id}">Approve plan</button><button class="btn" data-act="plan" data-id="${id}" ${thinking ? "disabled" : ""}>Redo plan</button><button class="btn" data-act="unplan" data-id="${id}">Clear plan</button>`
            : `<button class="btn primary" data-act="plan" data-id="${id}" ${thinking ? "disabled" : ""}>${thinking ? "Planning…" : "Give me a plan"}</button>`}
        <button class="btn" data-act="respond" data-id="${id}">${p ? "Send my input" : "Ask Jarvis"}</button>
        <button class="btn deny" data-act="deny" data-id="${id}">Dismiss</button></div>`;
  } else if (st === "denied") {
    const clears = new Date((m.decidedAt || Date.now()) + KEEP_DISMISSED).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
    h += `<div class="actions"><button class="btn primary" data-act="reopen" data-id="${id}">Restore</button><span class="clears">Clears ${esc(clears)}</span></div>`;
  } else if (st === "done") {
    h += `<div class="actions"><button class="btn" data-act="reopen" data-id="${id}">Reopen</button></div>`;
  }
  return `<article class="job" id="m-${id}">${h}</article>`;
}

async function save(id, patch) {
  const m = items.get(id), before = m && { ...m };
  if (m) items.set(id, { ...m, ...patch });
  render();
  try { await J.save("mail/" + id, patch); say(""); return true; }
  catch (e) { if (before) items.set(id, before); render(); say("Couldn't save that. " + e.message); return false; }
}

async function act(what, id) {
  const m = items.get(id);
  if (!m) return;
  if (what === "read") { open.has(id) ? open.delete(id) : open.add(id); return render(); }
  const note = ($("r-" + id)?.value || "").trim();
  if (what === "deny") { keep.delete(id); return save(id, { status: "denied", decision: "deny", note, decidedAt: Date.now() }); }
  if (what === "reopen") return save(id, { status: "open", decision: null, note: "", result: "", links: [] });
  if (what === "unplan") { keep.delete(id); if (await save(id, { plan: null, plannedAt: null, note: "" })) { follow(id); say("Plan cleared."); } return; }
  if (what === "plan") {
    busy.add(id); render(); say("Jarvis is making a plan…");
    try {
      const out = await J.ai("plan", { id, note }); items.set(id, { id, ...out.doc }); keep.delete(id);
      busy.delete(id); follow(id); say("Plan ready.");
    }
    catch (e) { say("Couldn't make a plan. " + e.message); }
    busy.delete(id); return render();
  }
  // Approve and your own instructions need Claude with your Gmail: save the request, then wake Jarvis
  if (what === "respond" && !note) return say("Type what you want Jarvis to do first.");
  if (await save(id, { status: "working", decision: what, note, decidedAt: Date.now(), result: "", links: [] })) {
    keep.delete(id);
    const w = await J.wake("Mail request: " + id);
    if (!w.woke) say("Saved. Jarvis will pick this up on its next scheduled run.");
  }
}

// After a plan the card can move to Needs you: follow it there so the result is on screen
function follow(id) {
  const m = items.get(id);
  if (!m) return;
  document.querySelector(`.tab[data-tab="${bucket(m)}"]`)?.click();
  requestAnimationFrame(() => $("m-" + id)?.scrollIntoView({ block: "start", behavior: "smooth" }));
}

let jumped = false;
function jump() {
  const id = decodeURIComponent(location.hash.slice(1)), m = items.get(id);
  if (jumped || !m) return;
  jumped = true;
  document.querySelector(`.tab[data-tab="${bucket(m)}"]`)?.click();
  const el = $("m-" + id);
  if (el) { el.classList.add("focus"); el.scrollIntoView({ block: "start" }); }
}

async function load() {
  if (busy.size || document.activeElement?.tagName === "TEXTAREA") return;
  try {
    if (live) {
      const d = await J.list("mail", "meta");
      items = new Map(Object.entries(d.mail).map(([id, m]) => [id, { id, ...m }]));
      for (const m of [...items.values()]) {  // dismissed emails go away 3 days after you dismiss them
        if (m.status === "denied" && Date.now() - (m.decidedAt || 0) > KEEP_DISMISSED) { items.delete(m.id); J.remove("mail/" + m.id).catch(() => {}); }
      }
      const t = d.meta.triage;
      if (t?.updated) $("scan").textContent = `What each email says, with a plan whenever you ask. Last checked ${when(t.updated)}. Nothing is ever sent without you.`;
    } else {
      let topic = location.hash.slice(1);
      try { if (!topic) topic = localStorage.getItem("jarvis-topic") || ""; } catch (e) {}
      if (!/^[A-Za-z0-9_-]+$/.test(topic)) { $("list").innerHTML = `<p class="empty">Open this page from your HUD to see your mail.</p>`; return; }
      const res = await fetch(`https://ntfy.sh/${topic.replace(/-hud$/, "")}-mail/json?poll=1&since=24h`, { cache: "no-store" });
      const msgs = (await res.text()).trim().split("\n").filter(Boolean).map((l) => JSON.parse(l)).filter((x) => x.event === "message");
      const d = msgs.length ? JSON.parse(msgs[msgs.length - 1].message) : {};
      items = new Map((d.flagged || []).map((m) => [m.id, m]));
      say("This public copy is read-only. Open your private Jarvis site to act on these.");
    }
    render(); jump();
  } catch (e) {
    if (!items.size) $("list").innerHTML = `<p class="empty">Couldn't load your mail. Try again in a minute.</p>`;
    say(e.message);
  }
}

(async () => {
  live = !!(await J.ping());
  await load();
  J.poll(load, live ? 15000 : 120000);
})();
</script>
</body>
</html>
