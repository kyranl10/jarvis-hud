<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Jarvis Internships</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }

/* Same visual language as the Jarvis HUD: one dark theme by design, cyan telemetry on near-black. */
:root {
  --void: #04080d;
  --panel: rgba(20, 60, 80, 0.18);
  --panel-solid: #08131b;
  --line: rgba(111, 227, 255, 0.22);
  --arc: #6fe3ff;
  --arc-dim: #4a9bb3;
  --text: #d7f6ff;
  --muted: #7fa8b6;
  --gold: #ffbf4d;
  --alert: #ff6b5b;
  --ok: #5fe0a0;
  --paper: #fbfcfd;
  --ink: #15202b;
  --display: "Rajdhani", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html { background: var(--void); }
body {
  background: var(--void) radial-gradient(ellipse 120% 50% at 50% -10%, rgba(111, 227, 255, 0.10), transparent 60%);
  color: var(--text); font-family: var(--display); font-size: 17px;
  min-height: 100vh; padding-inline: 16px;
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; }
header { display: grid; gap: 4px; }
header .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.24em; color: var(--arc-dim); text-transform: uppercase; }
header h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: 0.03em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 15px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { border: 1px solid var(--line); background: var(--panel); padding: 10px 12px; display: grid; gap: 2px; }
.stat b { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
.stat i { font-style: normal; font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, 1fr); } }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.tab {
  font: 600 13px var(--display); letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted); background: none; border: 1px solid transparent; padding: 7px 12px; cursor: pointer;
}
.tab[aria-selected="true"] { color: var(--arc); border-color: var(--line); background: var(--panel); }
.tab .n { font-family: var(--mono); letter-spacing: 0; margin-left: 6px; color: var(--arc-dim); }

.list { display: grid; gap: 14px; }
.job {
  border: 1px solid var(--line); background: var(--panel); padding: 14px 16px 16px; display: grid; gap: 10px;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
}
.job .co { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--arc-dim); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.job h3 { margin: 0; font-size: 21px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: 84px 1fr; gap: 4px 12px; margin: 0; }
.facts dt { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.facts dd { margin: 0; min-width: 0; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.summary { margin: 0; color: var(--text); font-size: 16px; line-height: 1.4; max-width: 65ch; }
.reqs { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; list-style: none; }
.reqs li { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); padding: 2px 7px; }
.job .co-meta { display: inline-flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.job .posted { color: var(--arc); font-variant-numeric: tabular-nums; }
.fresh-tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; padding: 1px 7px; color: var(--void); background: var(--gold); font-variant-numeric: tabular-nums; }
.odds { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; padding: 1px 7px; border: 1px solid currentColor; font-variant-numeric: tabular-nums; }
.odds.hi { color: var(--ok); } .odds.mid { color: var(--gold); } .odds.lo { color: var(--alert); }
.sort { margin-left: auto; display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.sort select { font-size: 14px; padding: 4px 8px; }
.sort.src { margin-left: 0; }
.status { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; padding: 1px 7px; border: 1px solid currentColor; text-transform: uppercase; }
.st-tailoring, .st-review { color: var(--gold); }
.st-ready { color: var(--arc); }
.st-applied, .st-interview { color: var(--ok); }
.st-offer { color: var(--ok); }
.st-rejected, .st-denied { color: var(--alert); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button.btn, a.btn {
  font: 600 13px var(--display); letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none;
  color: var(--arc); background: transparent; border: 1px solid var(--line); padding: 9px 14px; cursor: pointer;
}
button.btn:hover, a.btn:hover, button.btn:focus-visible, a.btn:focus-visible { border-color: var(--arc); box-shadow: 0 0 14px rgba(111, 227, 255, 0.3); outline: none; }
button.btn.primary { background: rgba(111, 227, 255, 0.14); border-color: var(--arc); }
button.btn.deny { color: var(--alert); border-color: rgba(255, 107, 91, 0.35); }
button.btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
select { font: 500 15px var(--display); color: var(--text); background: var(--panel-solid); border: 1px solid var(--line); padding: 7px 10px; }
textarea { width: 100%; min-height: 70px; font: 15px var(--display); color: var(--text); background: var(--panel-solid); border: 1px solid var(--line); padding: 8px 10px; resize: vertical; }
.note { color: var(--muted); font-size: 14px; margin: 0; }
.note.warn { color: var(--gold); }
.empty { color: var(--muted); font-size: 16px; padding: 20px 0; text-align: center; }

/* Tailored resume preview: a sheet of paper so it reads like the PDF it becomes */
.back { font-family: var(--mono); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--arc); text-decoration: none;
  justify-self: start; border: 1px solid var(--line); padding: 8px 14px; margin-bottom: 6px; }
.back:hover { color: var(--arc); }
a.btn.primary { background: rgba(111, 227, 255, 0.14); border-color: var(--arc); }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <a class="back" href="./" id="back">‹ HUD</a>
    <span class="kicker">Jarvis · Internship search</span>
    <h1>Data internships</h1>
    <p id="scan">Summer 2027 and co-ops · data roles · US and remote</p>
  </header>

  <section class="stats" aria-label="Search overview">
    <div class="stat"><b id="s-new">–</b><i>To review</i></div>
    <div class="stat"><b id="s-progress">–</b><i>In progress</i></div>
    <div class="stat"><b id="s-applied">–</b><i>Applied</i></div>
    <div class="stat"><b id="s-interview">–</b><i>Interviews</i></div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="new" aria-selected="true">To review<span class="n" id="n-new"></span></button>
    <button class="tab" role="tab" data-tab="progress" aria-selected="false">In progress<span class="n" id="n-progress"></span></button>
    <button class="tab" role="tab" data-tab="applied" aria-selected="false">Applied<span class="n" id="n-applied"></span></button>
    <button class="tab" role="tab" data-tab="denied" aria-selected="false">Denied<span class="n" id="n-denied"></span></button>
    <label class="sort">Sort <select id="sort"><option value="posted">Newest</option><option value="odds">Best odds</option></select></label>
    <label class="sort src">Source <select id="src"><option value="all">All</option></select></label>
  </nav>

  <section class="list" id="list" aria-live="polite"><p class="empty">Loading internships…</p></section>
  <p class="foot" id="foot">Apply and Deny open your Claude page, where your resume gets tailored</p>
</main>

<script>
// Read-only list of the internship search, refreshed by every scan. Decisions and resume tailoring
// happen on the private Claude page, so the resume never lands in this public repo.
const CLAUDE = "https://claude.ai/artifact/VqWzcc7FFSFHTUTnWHy9gh";
const TABS = { new: ["new"], progress: ["tailoring", "review", "ready"], applied: ["applied", "interview", "offer", "rejected"], denied: ["denied"] };
const LABEL = { new: "New", tailoring: "Tailoring", review: "Review resume", ready: "Ready to apply", applied: "Applied",
                interview: "Interview", offer: "Offer", rejected: "Rejected", denied: "Denied" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => /^https:\/\//i.test(String(u || "")) ? String(u) : "";
// "New today 11:15 AM" on listings that first reached the page today, so each scan's additions stand out
const today = (ms) => !!ms && new Date(ms).toDateString() === new Date().toDateString();
const fresh = (j) => today(j.added) ? `<span class="fresh-tag" title="First added to this page today">New today ${esc(new Date(j.added).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }))}</span>` : "";
const day = (ms) => ms ? new Date(ms).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "";
let data = { jobs: [] }, tab = "new";

// Return to the personal HUD: the link's hash, else the topic the HUD saved on this device.
let topic = location.hash.slice(1);
try { if (!topic) topic = localStorage.getItem("jarvis-topic") || ""; } catch (e) {}
if (/^[A-Za-z0-9_-]+$/.test(topic)) $("back").href = "./#" + topic;
for (const b of document.querySelectorAll(".tab")) {
  b.onclick = () => {
    tab = b.dataset.tab;
    for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", String(t === b));
    render();
  };
}

// Requirements arrive as a list, or from some scans as one "a; b; c" string
const reqs = (r) => Array.isArray(r) ? r : typeof r === "string" ? r.split(/;\s*/).filter(Boolean) : [];
function card(j) {
  const d = j.details || {}, st = j.status || "new", url = safeUrl(j.url);
  const facts = [
    ["Role", d.role], ["Dates", d.dates || (j.terms || []).join(", ")], ["Pay", d.pay || "Not listed"],
    ["Location", d.location || (j.locations || []).join(" · ")], ["Deadline", d.deadline], ["Source", j.source], ["Added", j.sheetAdded && `${j.sheetAdded} to the UNC sheet`],
  ].filter(([, v]) => v);
  const go = (label, cls) => `<a class="btn${cls}" href="${CLAUDE}#${esc(j.id)}" target="_blank" rel="noopener">${label}</a>`;
  const actions = st === "new" ? go("Apply", " primary") + go("Deny", "") : go(st === "denied" ? "Restore" : "Open in Claude", "");
  return `<article class="job">
    <div class="co"><span>${esc(j.company)}</span><span class="co-meta">${fresh(j)}${j.fit ? `<span class="odds ${j.fit.score >= 7 ? "hi" : j.fit.score >= 5 ? "mid" : "lo"}" title="Estimated hire odds">Odds ${esc(j.fit.score)}/10</span>` : ""}${j.posted ? `<span class="posted">Posted ${esc(day(j.posted))}</span>` : ""}${
      st !== "new" ? `<span class="status st-${esc(st)}">${esc(LABEL[st] || st)}</span>` : ""}</span></div>
    <h3>${esc(j.title)}</h3>
    ${j.fit?.why ? `<p class="note">Odds: ${esc(j.fit.why)}</p>` : ""}
    ${j.news ? `<p class="note warn">${esc(day(j.news.at))}: ${esc(j.news.text)}</p>` : ""}
    <dl class="facts">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    ${d.summary ? `<p class="summary">${esc(d.summary)}</p>` : `<p class="note">No description could be read from the posting. Open it to see the details.</p>`}
    ${reqs(d.requirements).length ? `<ul class="reqs">${reqs(d.requirements).map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
    <div class="actions">${actions}${url ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">View posting</a>` : ""}</div>
  </article>`;
}

// Newest first, or best estimated odds first; the choice is remembered on this device
let sortBy = "posted";
try { sortBy = localStorage.getItem("intern-sort") || "posted"; } catch (e) {}
if (sortBy !== "odds") sortBy = "posted";
let src = "all";
try { src = localStorage.getItem("intern-src") || "all"; } catch (e) {}
// Source order: UNC board first, then the job alerts, then Simplify, then anything else
const SOURCES = ["UNC board", "LinkedIn alert", "Handshake alert", "Simplify"];
const byOrder = (a, b) => sortBy === "odds"
  ? (b.fit?.score ?? 0) - (a.fit?.score ?? 0) || (b.posted ?? 0) - (a.posted ?? 0)
  : (b.posted ?? 0) - (a.posted ?? 0);
document.getElementById("sort").value = sortBy;
const srcSel = document.getElementById("src");
const fillSources = (list) => {
  const seen = [...new Set(list.map((j) => j.source).filter(Boolean))];
  const names = [...SOURCES.filter((s) => seen.includes(s)), ...seen.filter((s) => !SOURCES.includes(s)).sort()];
  if (src !== "all" && !names.includes(src)) src = "all";
  srcSel.innerHTML = '<option value="all">All</option>' + names.map((s) => `<option>${s.replace(/[<&]/g, "")}</option>`).join("");
  srcSel.value = src;
};
srcSel.onchange = (e) => { src = e.target.value; try { localStorage.setItem("intern-src", src); } catch (err) {} render(); };
document.getElementById("sort").onchange = (e) => {
  sortBy = e.target.value;
  try { localStorage.setItem("intern-sort", sortBy); } catch (err) {}
  render();
};

function render() {
  const c = { new: 0, progress: 0, applied: 0, denied: 0, interview: 0 };
  for (const j of data.jobs) {
    for (const [t, sts] of Object.entries(TABS)) if (sts.includes(j.status || "new")) c[t]++;
    if (j.status === "interview" || j.status === "offer") c.interview++;
  }
  // Without the private feed every listing looks new, so the totals come from the public counts instead
  for (const k of ["new", "progress", "applied", "interview"]) $("s-" + k).textContent = (data.mine ? c : data.counts || c)[k] ?? 0;
  for (const t of Object.keys(TABS)) $("n-" + t).textContent = c[t] || "";
  if (data.updated) $("scan").textContent = `Summer 2027 and co-ops · data roles · US and remote · last searched ${
    new Date(data.updated).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" })}`;
  fillSources(data.jobs);
  const shown = data.jobs.filter((j) => TABS[tab].includes(j.status || "new") && (src === "all" || j.source === src)).sort(byOrder);
  $("list").innerHTML = shown.length ? shown.map(card).join("")
    : `<p class="empty">${{ new: "Nothing new to review. Jarvis checks again every few hours.", progress: "Nothing in progress.",
                           applied: "No applications yet.", denied: "Nothing denied." }[tab]}</p>`;
}

// Statuses, replies and older acted-on jobs aren't in the public jobs.json. They come through the HUD's
// private ntfy feed, so they only show when this page is opened from Kyran's HUD link (or after it on this device).
async function privateView() {
  if (!/^[A-Za-z0-9_-]+$/.test(topic)) return null;
  try {
    const res = await fetch(`https://ntfy.sh/${topic.replace(/-hud$/, "")}-jobs/json?poll=1&since=24h`, { cache: "no-store" });
    const msgs = (await res.text()).trim().split("\n").filter(Boolean).map((l) => JSON.parse(l)).filter((m) => m.event === "message");
    return msgs.length ? JSON.parse(msgs[msgs.length - 1].message) : null;
  } catch (e) { return null; }
}

async function load() {
  try {
    const [res, mine] = await Promise.all([fetch("jobs.json", { cache: "no-store" }), privateView()]);
    data = await res.json();
    data.mine = !!mine;
    if (mine) {
      const have = new Set(data.jobs.map((j) => j.id));
      data.jobs.push(...(mine.cards || []).filter((c) => !have.has(c.id)));
      for (const j of data.jobs) {
        const st = (mine.status || {})[j.id];
        if (st) { j.status = st.s; if (st.n) j.news = { text: st.n, at: st.a }; }
      }
    }
    render();
  } catch (e) {
    $("list").innerHTML = `<p class="empty">Couldn't load the internship list. Try again in a minute.</p>`;
  }
}
load(); setInterval(load, 15 * 60000);
// Live updates: ntfy pushes each new post the moment it lands, so pages don't wait for the 15-minute poll
function live(t, fn) {
  if (!/^[A-Za-z0-9_-]+$/.test(t) || !window.EventSource) return;
  new EventSource(`https://ntfy.sh/${t}/sse`).onmessage = (e) => { try { if (JSON.parse(e.data).event === "message") fn(); } catch (err) {} };
}
if (/^[A-Za-z0-9_-]+$/.test(topic)) live(topic.replace(/-hud$/, "") + "-jobs", load);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
