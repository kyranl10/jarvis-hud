<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#04080d">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* One site, one tab bar: the HUD, Mail and Internships pages each live in their own frame and keep
   updating in the background, so switching tabs is instant. Single dark theme, like the pages it holds. */
*,*::before,*::after { box-sizing: border-box; }
:root {
  --void: #04080d; --line: rgba(111, 227, 255, 0.22); --arc: #6fe3ff; --arc-dim: #4a9bb3; --text: #d7f6ff; --muted: #7fa8b6;
  --display: "Rajdhani", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--void); color: var(--text); font-family: var(--display); }
body { display: flex; flex-direction: column; height: 100dvh; }
nav {
  flex: none; display: flex; align-items: center; gap: 4px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px;
  border-bottom: 1px solid var(--line); background: rgba(4, 8, 13, 0.96); overflow-x: auto; scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
.brand { font-family: var(--mono); font-size: 12px; letter-spacing: 0.3em; color: var(--arc); margin-right: 10px; white-space: nowrap; }
nav button, nav a {
  font: 600 15px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: none;
  border: 1px solid transparent; padding: 9px 12px; cursor: pointer; text-decoration: none; white-space: nowrap;
}
nav button:hover, nav a:hover { color: var(--text); }
nav button[aria-selected="true"] { color: var(--arc); border-color: var(--line); background: rgba(111, 227, 255, 0.08); }
nav button:focus-visible, nav a:focus-visible { outline: 1px solid var(--arc); outline-offset: 1px; }
nav a { margin-left: auto; }
@media (max-width: 440px) { .brand { display: none; } nav { padding-inline: 10px; gap: 2px; } nav button, nav a { padding-inline: 9px; font-size: 14px; } }
main { flex: 1; position: relative; padding-bottom: env(safe-area-inset-bottom, 0px); }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--void); }
iframe[hidden] { display: none; }
</style>
</head>
<body>
<nav aria-label="Jarvis">
  <span class="brand">JARVIS</span>
  <button type="button" role="tab" data-tab="hud">HUD</button>
  <button type="button" role="tab" data-tab="mail">Mail</button>
  <button type="button" role="tab" data-tab="internships">Internships</button>
  <a href="https://claude.ai/artifact/QvAKoTAZQz4tg1QmeChgZt" target="_blank" rel="noopener">Chat ↗</a>
</nav>
<main id="frames"></main>
<script>
const TABS = { hud: "hud.html", mail: "mail.html", internships: "internships.html" };
const ok = (t) => /^[A-Za-z0-9_-]+$/.test(t);

// The private key after # unlocks the data; the HUD saves it on this device, so a bare address works after the first visit
let topic = location.hash.slice(1);
try { if (!ok(topic)) topic = localStorage.getItem("jarvis-topic") || ""; } catch (e) {}
if (ok(topic) && location.hash.length < 2) history.replaceState(null, "", "#" + topic);
const frames = {};

// Same-origin frames, so the shell can tidy them: hide each page's own "back to HUD" button and
// turn links between the pages into tab switches instead of loading a page inside a page.
function adopt(f) {
  let doc;
  try { doc = f.contentDocument; } catch (e) { return; }
  if (!doc) return;
  const s = doc.createElement("style");
  s.textContent = ".back { display: none !important; }";
  doc.head.appendChild(s);
  doc.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest("a[href]");
    if (!a || (a.target && a.target !== "_self")) return;
    const u = new URL(a.href, doc.baseURI);
    if (u.origin !== location.origin) return;
    const name = u.pathname.split("/").pop().replace(/\.html$/, "");
    const tab = name === "" || name === "index" || name === "hud" ? "hud" : TABS[name] ? name : null;
    if (!tab) return;
    e.preventDefault();
    show(tab);
  }, true);
}

function show(tab) {
  if (!TABS[tab]) tab = "hud";
  if (!frames[tab]) {
    const f = document.createElement("iframe");
    f.title = tab === "hud" ? "Jarvis HUD" : "Jarvis " + tab[0].toUpperCase() + tab.slice(1);
    f.addEventListener("load", () => adopt(f));
    f.src = TABS[tab] + (ok(topic) ? "#" + topic : "");
    document.getElementById("frames").appendChild(f);
    frames[tab] = f;
  }
  for (const [t, f] of Object.entries(frames)) f.hidden = t !== tab;
  for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-selected", String(b.dataset.tab === tab));
  try { localStorage.setItem("jarvis-tab", tab); } catch (e) {}
}

for (const b of document.querySelectorAll("nav button")) b.onclick = () => show(b.dataset.tab);
let start = new URLSearchParams(location.search).get("tab");
try { if (!TABS[start]) start = localStorage.getItem("jarvis-tab"); } catch (e) {}
show(start || "hud");
</script>
</body>
</html>
